[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elanquant"
version = "0.1.0"
description = "Auditable A-share Kronos research and paper-trading system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
]
repro = [
  "huggingface-hub>=0.34,<1",
  "pandas>=2.2,<3",
  "pyarrow>=17,<25",
]
inference = [
  "einops==0.8.1",
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "safetensors>=0.6,<1",
  "torch>=2,<3",
  "tqdm>=4.67,<5",
]

[project.scripts]
elanquant-api = "elanquant.api.app:main"
elanquant-worker = "elanquant.orchestration.worker:main"
elanquant = "elanquant.repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/elanquant"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "elanquant/resources/README.md"
"THIRD_PARTY_NOTICES.md" = "elanquant/resources/THIRD_PARTY_NOTICES.md"
"configs" = "elanquant/resources/configs"
"docs" = "elanquant/resources/docs"
"examples" = "elanquant/resources/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["backend/src", "scripts/research"]
exclude = ["scripts/server"]
extraPaths = ["backend/src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
